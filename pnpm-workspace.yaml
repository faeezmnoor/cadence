packages:
  - "apps/*"
  - "services/*"

allowBuilds:
  '@sentry/cli': set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false

# Allow these packages' postinstall scripts to run.
# (pnpm 11 ignores all postinstalls by default unless explicitly allowed.)
onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
